<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Stock - Universitas Terbuka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/addNewStock.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <!---HEADER---NAVIGASI 1--->
    <header class="navbar" style="padding: 0 60px">
      <!-- Logo -->
      <figure class="logo-container">
        <a href="dashboard.html">
          <img src="assets/logo.svg" alt="SITTA-UT Logo" class="logo-img" />
        </a>
      </figure>
      <!-- Login/Logout -->
      <div class="nav-auth">
        <a href="index.html" class="login-link">Log in</a>
        <a href="index.html" class="btn-get-started">
          <button>Sign in</button>
        </a>
      </div>
    </header>

    <div id="app">
      <!-- MAIN CONTENT -->
      <main class="container">
        <!-- PAGE TITLE -->
        <div class="page-title">
          <h2>Add Teaching Materials Inventory</h2>
        </div>
        <!-- FORM Tambah Stok -->
        <section class="form-card">
          <!-- FORM HEADER -->
          <div class="form-header">
            <div class="icon-plus">
              <i class="fas fa-plus">+</i>
            </div>
            <h3>Add New Stock</h3>
          </div>
          <!-- FORM BODY -->
          <form class="add-stock-form" id="addStockForm" @submit.prevent="simpanDataStok">
            <!-- INPUT FIELDS -->
            <div class="input-grid">
              <!-- Code -->
              <div class="form-group code-group">
                <label for="code">Code</label>
                <input type="text" id="code" v-model="formStok.kode" placeholder="MSIM4403" required />
              </div>
              <!-- Material Name -->
              <div class="form-group name-group">
                <label for="materialName">Teaching Material Name</label>
                <input type="text" id="materialName" v-model="formStok.judul" placeholder="Data Mining" required />
              </div>
              <!-- Category -->
              <div class="form-group category-group">
                <label for="category">Category</label>
                <select id="category" v-model="formStok.kategori" required style="padding: 12px; border-radius: 8px; border: none; background: #f1f5f9; width: 100%;">
                  <option disabled value="">Pilih Kategori</option>
                  <option v-for="kategori in kategoriList" :key="kategori" :value="kategori">{{ kategori }}</option>
                </select>
              </div>
              <!-- Quantity -->
              <div class="form-group qty-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" v-model.number="formStok.qty" placeholder="0" required />
              </div>
              <!-- Shelf Location -->
              <div class="form-group shelf-group">
                <label for="shelf">Shelf Location</label>
                <input type="text" id="shelf" v-model="formStok.lokasiRak" placeholder="R1-A1" required />
              </div>
              <!-- Regional UT -->
              <div class="form-group region-group">
                <label for="region">Regional UT</label>
                <!-- Select UPBJJ -->
                <select id="region" v-model="formStok.upbjj" required style="padding: 12px; border-radius: 8px; border: none; background: #f1f5f9; width: 100%;">
                  <option disabled value="">Pilih UPBJJ</option>
                  <option v-for="lokasi in upbjjList" :key="lokasi" :value="lokasi">{{ lokasi }}</option>
                </select>
              </div>
              <!-- Price -->
              <div class="form-group price-group">
                <label for="price">Price</label>
                <input type="number" id="price" v-model.number="formStok.harga" placeholder="80000" required />
              </div>
              <!-- Safety Stock -->
              <div class="form-group safety-group">
                <label for="safety">Safety</label>
                <input type="number" id="safety" v-model.number="formStok.safety" placeholder="0" required />
              </div>
              <!-- Notes -->
              <div class="form-group notes-group">
                <label for="notes">Notes</label>
                <input type="text" id="notes" v-model="formStok.catatanHTML" placeholder="Opsional..." />
              </div>
            </div> <!-- INPUT FIELD END -->
            <!-- FORM ACTIONS -->
            <div class="form-actions">
              <button type="submit" class="btn-save-data">
                <i class="far fa-save"></i> Save Data
              </button>
            </div> 
          </form>  <!--FORM BODY END  -->
        </section> <!-- FORM TAMBAH STOK END -->
     </main>
    </div> 
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src="js/dataBahanAjar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
