<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SITTA-UT</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- BAGIAN KIRI: FORM LOGIN -->
      <div class="login-section">
				<figure class="logo-container">
        <img src="assets/img/logo.svg" alt="SITTA-UT Logo" class="logo-img" />
        <span class="brand-name">Log in to SITTA-UT</span>
        </figure>
		
        <h2 class="welcome-text">Log in into your account</h2>

        <form id="loginForm">
          <!-- Input Email -->
          <div class="input-group">
            <label class="input-label">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="jauza@email.com"
                required
              />
              <div class="input-icon">&#9993;</div>
            </div>
          </div>

          <!-- Input Password -->
          <div class="input-group">
            <label class="input-label">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter your password"
                required
              />
              <div class="input-icon">&#128274;</div>
            </div>
          </div>
          <div class="forgot-password">
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-login">Log In Now</button>
        </form>

        <div class="separator">OR</div>
          <button type="button" class="btn btn-signup" id="signupBtn">
            Sign Up Now
          </button>
        </div>

        <!-- BAGIAN KANAN: ILLUSTRATOR -->
        <div class="illustration-section">
          <img src="assets/img/login-illustrator.svg" alt="Login Illustration" class="feat-img" />
        </div>
    </div>

    <!-- Memanggil file JS eksternal -->
    <script src="js/app.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
